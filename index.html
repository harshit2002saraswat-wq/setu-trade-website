<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Setu Trade — India-based exporter of fresh vegetables, agro products, millets, and organic products to international markets. Connecting global importers, wholesalers, and distributors with quality Indian agricultural produce."
    />
    <title>Setu Trade — Indian Agro Products & Global Trade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta property="og:image" content="https://images.pexels.com/photos/2382904/pexels-photo-2382904.jpeg?auto=compress&cs=tinysrgb&h=630&w=1200">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Setu Trade">
    <meta property="og:url" content="https://setutrade.com">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://images.pexels.com/photos/2382904/pexels-photo-2382904.jpeg?auto=compress&cs=tinysrgb&h=630&w=1200">
    <link rel="canonical" href="https://setutrade.com" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Setu Trade",
      "description": "India-based agro-products trading business connecting Indian agricultural products with international buyers.",
      "url": "https://setutrade.com",
      "logo": "https://setutrade.com/favicon.svg"
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Setu Trade",
      "url": "https://setutrade.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://setutrade.com/products?q={query}",
        "query-input": "required name=query"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
